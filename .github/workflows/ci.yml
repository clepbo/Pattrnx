name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (under a non-UTC server timezone)
        run: pnpm test:coverage
        env:
          TZ: America/Los_Angeles
      - run: pnpm audit --prod --audit-level high

  database-and-e2e:
    name: Database, integration and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies migrations and seed)
        run: pnpm db:start
      - name: Export local Supabase env
        run: scripts/local-env.sh >> "$GITHUB_ENV"

      - run: pnpm db:lint
      - run: pnpm db:test
      - name: Generated DB types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- src/server/db/database.types.ts
      - run: pnpm test:integration

      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - if: always()
        run: pnpm db:stop
